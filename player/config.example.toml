# /etc/signage/config.toml (mode 640, owner root:signage). Not in git once filled in.
server_url = "https://signage.example.com"
token_file = "/etc/signage/token"
data_dir = "/var/lib/signage"
mpv_ipc = "unix:/run/signage/mpv.sock"
# fallback_image defaults to assets/fallback.png inside the release.

# Polling for the manifest (phase 1; the heartbeat replaces it in phase 2).
poll_interval_s = 60
full_check_interval_s = 900
backoff_min_s = 5
backoff_max_s = 900
http_timeout_s = 20

# Playlist re-evaluation (also always at local midnight).
reevaluate_interval_s = 300

# Disk.
min_free_mb = 1024
cleanup_grace_days = 7
max_deletions_per_run = 50

max_clock_skew_s = 120
log_level = "INFO"
