[project]
name = "coral"
version = "0.1.0"
description = "CORAL digital signage: dashboard, player agent and tools"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "argon2-cffi>=23.1",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8",
    "ruff>=0.6",
    "tzdata",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["dashboard", "player", "tools", "dashboard/tests", "player/tests"]
testpaths = ["dashboard/tests", "player/tests", "tools/tests"]
addopts = "-ra --import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106", "S108", "S311"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Form", "fastapi.Query", "fastapi.Header", "fastapi.File"]
