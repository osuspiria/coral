# /etc/tmpfiles.d/signage.conf
# Runtime directory for the mpv IPC socket.
d /run/signage 0750 signage signage -
# Agent -> updater requests (request.json, commit.json), written by the agent.
d /var/lib/signage/update 0750 signage signage -
# The updater's own state (pending, status, failed), readable by the agent.
d /var/lib/signage-updater 0755 root root -
